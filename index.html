    #splash { position: fixed; inset: 0; z-index: 1000; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;

    #splash.out { opacity: 0; transform: scale(1.04); pointer-events: none; }
    #splash svg { width: 132px; height: 132px; overflow: visible; filter: drop-shadow(0 10px 24px rgba(20,8,40,.45)); }
    #splash .word { font: 700 30px 'Bricolage Grotesque', 'Figtree', system-ui, sans-serif; letter-spacing: -0.02em; color: #F7F1FC; opacity: 0; transform: translateY(8px);
      animation: k-up .5s .75s cubic-bezier(.2,.8,.2,1) forwards; }
    #splash .glow { position: absolute; width: 260px; height: 260px; border-radius: 50%; background: radial-gradient(rgba(252,227,180,.35), transparent 65%); top: calc(46% - 210px);
      opacity: 0; animation: k-fade 1s .2s ease forwards; }
    .k-ribbon { transform: translateY(-110px); animation: k-drop .55s .1s cubic-bezier(.2,.9,.25,1.15) forwards; }
    .k-arm { stroke-dasharray: 44; stroke-dashoffset: 44; animation: k-draw .4s .5s cubic-bezier(.4,0,.2,1) forwards; }
    .k-refl { opacity: 0; transform-origin: 48px 50px; transform: scaleY(.2); animation: k-refl .6s .8s ease-out forwards; }
    .k-ripple { opacity: 0; animation: k-ripple 1.2s .9s ease-out forwards; }
    .k-star { opacity: 0; transform-origin: 76px 12px; transform: scale(0); animation: k-star .5s 1s cubic-bezier(.3,1.6,.5,1) forwards; }
    @keyframes k-drop { to { transform: translateY(0); } }
    @keyframes k-draw { to { stroke-dashoffset: 0; } }
    @keyframes k-refl { to { opacity: .6; transform: scaleY(1); } }
    @keyframes k-ripple { 0% { opacity: 0; transform: translateX(-4px); } 40% { opacity: .7; } 100% { opacity: .5; transform: translateX(0); } }
    @keyframes k-star { to { opacity: 1; transform: scale(1); } }
    @keyframes k-up { to { opacity: 1; transform: none; } }
    @keyframes k-fade { to { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { #splash * { animation-duration: .01s !important; animation-delay: 0s !important; } }
    body.app-in #app { animation: app-in .5s cubic-bezier(.2,.8,.2,1); }
    @keyframes app-in { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  </style>

        <path class="k-arm" d="M45 47 L71 16" stroke="#F7F1FC" stroke-width="12" stroke-linecap="round" fill="none"/>

  <script>
    (function () {
      var el = document.getElementById('splash');
      var standalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
      var mobile = window.matchMedia('(max-width: 899px)').matches;
      var seen = false;
      try { seen = sessionStorage.getItem('kairo-splash') === '1'; sessionStorage.setItem('kairo-splash', '1'); } catch (e) {}
      if (!(standalone || mobile) || seen) { window.__kairoReady = function () {}; el.remove(); return; }
      el.hidden = false;
      var t0 = Date.now(), ready = false, done = false;
      function finish() {
        if (done) return; done = true;
        el.classList.add('out'); document.body.classList.add('app-in');
        setTimeout(function () { el.remove(); document.body.classList.remove('app-in'); }, 500);
      }
      window.__kairoReady = function () { ready = true; setTimeout(finish, Math.max(0, 1500 - (Date.now() - t0))); };
      el.addEventListener('click', function () { if (ready) finish(); });
      setTimeout(finish, 5000);
    })();
  </script>
